name: Deploy Backend to AWS ECS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: backend
  ECR_REGISTRY: 532954947841.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  deploy:
    name: Build & Deploy Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 1. Gateway
      - name: Build and Push Gateway Image
        run: |
          docker build -t $ECR_REGISTRY/kaido-gateway:latest -f backend/gateway/Dockerfile ./backend
          docker push $ECR_REGISTRY/kaido-gateway:latest

      # 2. Auth Service
      - name: Build and Push Auth Image
        run: |
          docker build -t $ECR_REGISTRY/kaido-auth-service:latest -f backend/services/auth/Dockerfile ./backend
          docker push $ECR_REGISTRY/kaido-auth-service:latest

      # 3. Chat Service
      - name: Build and Push Chat Image
        run: |
          docker build -t $ECR_REGISTRY/kaido-chat-service:latest -f backend/services/chat/Dockerfile ./backend
          docker push $ECR_REGISTRY/kaido-chat-service:latest

      # 4. Agent Service
      - name: Build and Push Agent Image
        run: |
          docker build -t $ECR_REGISTRY/kaido-agent-service:latest -f backend/services/agent/Dockerfile ./backend
          docker push $ECR_REGISTRY/kaido-agent-service:latest

      # 5. Billing Service
      - name: Build and Push Billing Image
        run: |
          docker build -t $ECR_REGISTRY/kaido-billing-service:latest -f backend/services/billing/Dockerfile ./backend
          docker push $ECR_REGISTRY/kaido-billing-service:latest

      # 6. Deploy to ECS Fargate
      - name: Deploy to Amazon ECS
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service gateway-service --force-new-deployment
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service auth-service --force-new-deployment
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service chat-service --force-new-deployment
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service agent-service --force-new-deployment
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service billing-service --force-new-deployment
